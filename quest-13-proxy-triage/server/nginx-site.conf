# どの台に振られ、そこが何を返したかを残す
log_format upstreamlog '$remote_addr $status "$request" '
                       'upstream=$upstream_addr upstream_status=$upstream_status '
                       'rt=$request_time urt=$upstream_response_time';

upstream backends {
    # 死んだ台を切り離さない設定のまま運用している(max_fails=0)
    server 127.0.0.1:9001 max_fails=0;
    server 127.0.0.1:9002 max_fails=0;
    server 127.0.0.1:9003 max_fails=0;
}

server {
    listen 80 default_server;
    access_log /var/log/nginx/access.log upstreamlog;

    location / {
        proxy_pass http://backends;

        proxy_set_header Host reports.internal;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # 冪等でない処理があるため、他の台への再試行はしない方針
        proxy_next_upstream off;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }
}
