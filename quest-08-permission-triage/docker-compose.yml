services:
  fixture:
    build: ./fixture
    user: root
    cap_add:
      - LINUX_IMMUTABLE
    environment:
      CASE: "normal"
    volumes:
      - data:/data

  work:
    build: ./work
    volumes:
      - data:/data
    depends_on:
      fixture:
        condition: service_completed_successfully

volumes:
  data:
